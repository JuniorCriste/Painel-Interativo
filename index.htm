<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutiger Aero Panel - Full Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper-bg"></div>

    <div class="decor-icons top-icons">
        <img src="img/icons/frutiger3.png" class="blink-icon" style="--delay: 1s" alt="icon">
        <img src="img/icons/frutiger4.png" class="blink-icon" style="--delay: 3s" alt="icon">
    </div>

    <div class="master-wrapper">
        <main class="container">
            
            <section class="window-xp div-1">
                <div class="title-bar">
                    <div class="title-text">Visualizador de Conteúdo</div>
                    <div class="window-controls"><span>_</span><span>□</span><span class="close">X</span></div>
                </div>
                <div class="window-content slide-viewport">
                    <div class="glass-reflection"></div>
                    <div id="slide-track" class="slide-track">
                        <img src="img/slides/slide1.png" alt="Slide 1">
                        <img src="img/slides/slide2.png" alt="Slide 2">
                        <img src="img/slides/slide3.png" alt="Slide 3">
                        <img src="img/slides/slide4.png" alt="Slide 4">
                        <img src="img/slides/slide5.png" alt="Slide 5">
                    </div>
                </div>
            </section>

            <section class="window-xp grid-window">
                <div class="title-bar">
                    <div class="title-text">Acessos Rápidos</div>
                    <div class="window-controls"><span>_</span><span>□</span><span class="close">X</span></div>
                </div>
                <div class="window-content grid-botoes">
                    <a href="https://juniorcriste.github.io/QuizCapixaba/" class="btn-aero" data-key="1">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element1.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="2">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element2.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="3">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element3.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="4">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element4.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="5">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element5.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="6">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element6.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="7">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element7.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="8">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element8.png">
                    </a>
                    <a href="#" class="btn-aero" data-key="9">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element9.png">
                    </a>
                </div>
            </section>

        </main>
    </div>

    <div class="decor-icons bottom-icons">
        <img src="img/icons/frutiger1.png" class="blink-icon" style="--delay: 5s" alt="icon">
        <img src="img/icons/frutiger2.png" class="blink-icon" style="--delay: 7s" alt="icon">
    </div>

    <script src="script.js"></script>
</body>
</html>
