<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo - J.T.F</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-pattern"></div>

    <main class="dashboard">
        <section class="news-section">
            <div id="slide-track" class="slide-track">
                <img src="img/slides/slide1.png" alt="Slide 1"> 
                <img src="img/slides/slide2.png" alt="Slide 2">
                <img src="img/slides/slide3.png" alt="Slide 3">
                <img src="img/slides/slide4.png" alt="Slide 4">
                <img src="img/slides/slide5.png" alt="Slide 5">
            </div>
            <div class="slide-overlay">MANCHETES ATUAIS</div>
        </section>

        <div class="grid-container">
            <a href="https://juniorcriste.github.io/QuizCapixaba/" class="app-button" data-key="7" data-label="Quiz Capixaba">
                <img src="img/btn/element7.png">
            </a>
            <a href="#" class="app-button" data-key="8" data-label="Matemática">
                <img src="img/btn/element8.png">
            </a>
            <a href="#" class="app-button" data-key="9" data-label="Gênio Mat.">
                <img src="img/btn/element9.png">
            </a>
            <a href="#" class="app-button" data-key="4" data-label="Desafios">
                <img src="img/btn/element4.png">
            </a>
            <a href="#" class="app-button" data-key="5" data-label="Tic Tac Toe">
                <img src="img/btn/element5.png">
            </a>
            <a href="#" class="app-button" data-key="6" data-label="Interação">
                <img src="img/btn/element6.png">
            </a>
            <a href="#" class="app-button" data-key="3" data-label="Lógica">
                <img src="img/btn/element3.png">
            </a>
            <a href="#" class="app-button" data-key="2" data-label="Explorar">
                <img src="img/btn/element2.png">
            </a>
            <a href="#" class="app-button" data-key="1" data-label="Sair/Menu">
                <img src="img/btn/element1.png">
            </a>
        </div>
    </main>

    <footer class="modern-footer">
        <div class="footer-left">⌨ ATALHOS: 1-9</div>
        <div class="footer-center">EEEFM JOSÉ TEIXEIRA FIALHO</div>
        <div class="footer-right">18:50 📶</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
