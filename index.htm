<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo - J.T.F</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-pattern">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
        viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(231, 111, 81, 0.2)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(233, 196, 106, 0.2)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(42, 157, 143, 0.2)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(38, 70, 83, 0.2)" />
            </g>
        </svg>
    </div>

    <div class="main-wrapper">
        <main class="dashboard">
            <section class="news-section">
                <div id="slide-track" class="slide-track">
                    <img src="img/slides/slide1.png" alt="Slide 1"> 
                    <img src="img/slides/slide2.png" alt="Slide 2">
                    <img src="img/slides/slide3.png" alt="Slide 3">
                    <img src="img/slides/slide4.png" alt="Slide 4">
                    <img src="img/slides/slide5.png" alt="Slide 5">
                </div>
                <div class="slide-overlay">MANCHETES</div>
            </section>

            <div class="grid-container">
                <a href="https://juniorcriste.github.io/QuizCapixaba/" class="app-button" data-key="1" data-label="Pressione 1">
                    <img src="img/btn/quizcapixaba.png">
                </a>
                <a href="#" class="app-button" data-key="2" data-label="Pressione 2">
                    <img src="img/btn/materiadecapa.png">
                </a>
                <a href="#" class="app-button" data-key="3" data-label="Pressione 3">
                    <img src="img/btn/element1.png">
                </a>
                <a href="#" class="app-button" data-key="4" data-label="Pressione 4">
                    <img src="img/btn/element1.png">
                </a>
                <a href="#" class="app-button" data-key="5" data-label="Pressione 5">
                    <img src="img/btn/opentictactoe.png">
                </a>
                <a href="#" class="app-button" data-key="6" data-label="Pressione 6">
                    <img src="img/btn/geniomatematico.png">
                </a>
                <a href="#" class="app-button" data-key="7" data-label="Pressione 7">
                    <img src="img/btn/geniomatemeticodua.png">
                </a>
                <a href="#" class="app-button" data-key="8" data-label="Pressione 8">
                    <img src="img/btn/element2.png">
                </a>
                <a href="#" class="app-button" data-key="9" data-label="Pressione 9">
                    <img src="img/btn/element1.png"> 
                </a>
            </div>
        </main>
    </div>

    <footer class="modern-footer">
        <div class="footer-left">⌨ ATALHOS: 1-9</div>
        <div class="footer-center">EEEFM JOSÉ TEIXEIRA FIALHO</div>
        <div class="footer-right">📶 ONLINE</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
