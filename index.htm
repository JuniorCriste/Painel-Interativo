<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Fialho</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-pattern">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" viewBox="0 24 150 28" preserveAspectRatio="none">
            <defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" /></defs>
            <g class="parallax">
                <use href="#gentle-wave" x="48" y="0" fill="rgba(231, 111, 81, 0.2)" />
                <use href="#gentle-wave" x="48" y="3" fill="rgba(233, 196, 106, 0.2)" />
                <use href="#gentle-wave" x="48" y="5" fill="rgba(42, 157, 143, 0.2)" />
                <use href="#gentle-wave" x="48" y="7" fill="rgba(38, 70, 83, 0.2)" />
            </g>
        </svg>
    </div>

    <div class="main-wrapper">
        <main class="dashboard">
            <div class="top-content">
                <div class="side-branding">
                    <img src="img/Painel Fialho.png" alt="Painel Fialho" class="side-logo">
                </div>
                
                <section class="news-section">
                    <div id="slide-track" class="slide-track">
                        <div class="slide">
                            <img src="img/slides/slide1.png" alt="Slide 1">
                            <div class="slide-caption">LEGENDA DA NOTÍCIA 1</div>
                        </div>
                        <div class="slide">
                            <img src="img/slides/slide2.png" alt="Slide 2">
                            <div class="slide-caption">LEGENDA DA NOTÍCIA 2</div>
                        </div>
                        <div class="slide">
                            <img src="img/slides/slide3.png" alt="Slide 3">
                            <div class="slide-caption">LEGENDA DA NOTÍCIA 3</div>
                        </div>
                        <div class="slide">
                            <img src="img/slides/slide4.png" alt="Slide 4">
                            <div class="slide-caption">LEGENDA DA NOTÍCIA 4</div>
                        </div>
                        <div class="slide">
                            <img src="img/slides/slide5.png" alt="Slide 5">
                            <div class="slide-caption">LEGENDA DA NOTÍCIA 5</div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="grid-container">
                <a href="#" class="app-button" data-key="1" data-label="1 - QUIZ CAPIXABA">
                    <img src="img/btn/quizcapixaba.png">
                </a>
                <a href="#" class="app-button" data-key="2" data-label="2 - Good News!">
                    <img src="img/btn/goodnews.png">
                </a>
                <a href="#" class="app-button" data-key="3" data-label="3 - CHARADA DO DIA">
                    <img src="img/btn/charadadodia.png">
                </a>
                <a href="#" class="app-button" data-key="4" data-label="4 - QUIZ PROERER">
                    <img src="img/btn/erer.png">
                </a>
                <a href="#" class="app-button" data-key="5" data-label="5 - TIC TAC TOE">
                    <img src="img/btn/opentictactoe.png">
                </a>
                <a href="#" class="app-button" data-key="6" data-label="6 - GÊNIO MATEMÁTICO">
                    <img src="img/btn/geniomatematico.png">
                </a>
                <a href="#" class="app-button" data-key="7" data-label="7 - Rádio 100% Capixaba!">
                    <img src="img/btn/radiocapixaba.png">
                </a>
                <a href="#" class="app-button" data-key="8" data-label="8 - CARDÁPIO">
                    <img src="img/btn/cardapio.png">
                </a>
            </div>
        </main>
    </div> 

    <footer class="modern-footer">
        <div class="footer-left">⌨ UTILIZE ATALHOS DE 1-8 PARA NAVEGAR</div>
        <div class="footer-center">Painel Fialho - Por Junior Criste - github.com/JuniorCriste</div>
        <div class="footer-right">🌎Versão  1.5</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
