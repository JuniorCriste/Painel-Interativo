<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frutiger Aero Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wallpaper-bg"></div>

    <div class="master-wrapper">
        <main class="container">
            <section class="window-xp div-1">
                <div class="title-bar">
                    <div class="title-text">Visualizador de Slides</div>
                    <div class="window-controls"><span>_</span><span>□</span><span class="close">X</span></div>
                </div>
                <div class="window-content">
                    <div class="glass-reflection"></div>
                    <img id="slide-display" src="img/slides/slide1.png" alt="Slideshow">
                </div>
            </section>

            <section class="window-xp grid-window">
                <div class="title-bar blue-gradient">
                    <div class="title-text">Painel de Aplicativos</div>
                    <div class="window-controls"><span>_</span><span>□</span><span class="close">X</span></div>
                </div>
                <div class="window-content grid-botoes">
                    <a href="#" class="btn-aero" data-key="1">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element1.png" alt="Element 1">
                    </a>
                    <a href="#" class="btn-aero" data-key="2">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element2.png" alt="Element 2">
                    </a>
                    <a href="#" class="btn-aero" data-key="3">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element3.png" alt="Element 3">
                    </a>
                    <a href="#" class="btn-aero" data-key="4">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element4.png" alt="Element 4">
                    </a>
                    <a href="#" class="btn-aero" data-key="5">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element5.png" alt="Element 5">
                    </a>
                    <a href="#" class="btn-aero" data-key="6">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element6.png" alt="Element 6">
                    </a>
                    <a href="#" class="btn-aero" data-key="7">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element7.png" alt="Element 7">
                    </a>
                    <a href="#" class="btn-aero" data-key="8">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element8.png" alt="Element 8">
                    </a>
                    <a href="#" class="btn-aero" data-key="9">
                        <div class="glass-shine"></div>
                        <img src="img/btn/element9.png" alt="Element 9">
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
