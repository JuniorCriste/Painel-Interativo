<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo - Aero Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;700&family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="aero-bg">
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
    </div>

    <div class="master-wrapper">
        <header>
            <h1>Painel Interativo <span>Fialho</span></h1>
        </header>

        <main class="container">
            <section class="div-1">
                <div class="glass-overlay"></div>
                <img id="slide-display" src="img/slides/slide1.png" alt="Slideshow">
            </section>

            <section class="grid-botoes">
                <a href="https://juniorcriste.github.io/QuizCapixaba/" class="btn" data-key="1">
                    <span>Super Quiz Capixaba</span> <small>Pressione 1</small>
                </a>
                <a href="#" class="btn" data-key="2"><span>Matéria de Capa</span> <small>Pressione 2</small></a>
                <a href="#" class="btn" data-key="3"><span>Gênio da Matemática</span> <small>Pressione 3</small></a>
                <a href="#" class="btn" data-key="4"><span>Charada do Dia</span> <small>Pressione 4</small></a>
                <a href="#" class="btn" data-key="5"><span>Jogo da Velha</span> <small>Pressione 5</small></a>
                <a href="#" class="btn" data-key="6"><span>Boa Nova Diária</span> <small>Pressione 6</small></a>
                <a href="#" class="btn" data-key="17"><span>Quiz Capixaba</span> <small>Pressione 17</small></a>
                <a href="#" class="btn" data-key="8"><span>Quiz Consciência Negra</span> <small>Pressione 8</small></a>
                <a href="#" class="btn" data-key="9"><span>Cardápio do Dia</span> <small>Pressione 9</small></a>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
