<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Interativo - J.T.F</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blur"></div>

    <main class="dashboard">
        <section class="card news-card">
            <header class="card-header">
                <h2>Notícias e Manchetes</h2>
                <div class="status-dot"></div>
            </header>
            <div class="news-viewport">
                <div id="slide-track" class="slide-track">
                    <img src="img/slides/slide1.png" alt="Slide 1"> 
                    <img src="img/slides/slide2.png" alt="Slide 2">
                    <img src="img/slides/slide3.png" alt="Slide 3">
                    <img src="img/slides/slide4.png" alt="Slide 4">
                    <img src="img/slides/slide5.png" alt="Slide 5">
                </div>
            </div>
        </section>

        <section class="card grid-card">
            <header class="card-header">
                <h2>Central de Interação</h2>
            </header>
            <div class="grid-container">
                <a href="https://juniorcriste.github.io/QuizCapixaba/" class="app-button" data-key="7">
                    <img src="img/btn/element7.png">
                    <span>Quiz</span>
                </a>
                <a href="#" class="app-button" data-key="8"><img src="img/btn/element8.png"></a>
                <a href="#" class="app-button" data-key="9"><img src="img/btn/element9.png"></a>
                <a href="#" class="app-button" data-key="4"><img src="img/btn/element4.png"></a>
                <a href="#" class="app-button" data-key="5"><img src="img/btn/element5.png"></a>
                <a href="#" class="app-button" data-key="6"><img src="img/btn/element6.png"></a>
                <a href="#" class="app-button" data-key="3"><img src="img/btn/element3.png"></a>
                <a href="#" class="app-button" data-key="2"><img src="img/btn/element2.png"></a>
                <a href="#" class="app-button" data-key="1"><img src="img/btn/element1.png"></a>
            </div>
        </section>
    </main>

    <footer class="modern-footer">
        <p>Desenvolvido por <strong>Junior Criste</strong> &bull; EEEFM José Teixeira Fialho</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
