<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gênio Matemático</title>
    <link rel="stylesheet" href="style-dua.css">
</head>
<body>

    <div id="setup-screen" class="screen">
        <h1 class="game-title">Gênio Matemático</h1>
        <div id="setup-container">
            <p class="game-title-mini">Bem-vindo!</p>
            <button id="btn-unlock" class="postit-button">JOGAR (Pressione 5)</button>

             <div id="ranking-container" class="hidden">
                <p class="highscore-text">Atual Gênio da Matemática com <b><span id="high-score-val">0</span> pontos!</b></p>
                <center><div id="photo-winner"></div></center>
            </div>
        </div>
    </div>

    <div id="start-screen" class="screen hidden">
        <h1 class="game-title">Gênio Matemático</h1>
        <div id="loader-section" class="hidden">
            <p style="font-family: 'Gochi Hand'; text-align: center;">Carregando desafio...</p>
            <div class="loader-bar"><div id="load-progress"></div></div>
        </div>
        </div>

    <div id="game-screen" class="screen hidden">
        <div class="top-info">
            <div>Pontos: <span id="current-score">0</span></div>
            <div id="lives-display"></div>
        </div>
        <div class="timer-wrapper"><div id="timer-bar"></div></div>
        <div class="badge" id="badge">CÁLCULO</div>
        <div id="question"></div>
        <div id="inputs-container"></div>
    </div>

<div id="game-over-screen" class="screen hidden">
        <h2 class="game-title-mini">FIM DE JOGO</h2>
        <video id="webcam" autoplay playsinline class="hidden" style="width: 100%; border-radius: 10px; transform: scaleX(-1);"></video>
        <canvas id="photo-canvas" class="hidden" width="300" height="225"></canvas>
        <p id="msg-final" style="text-align: center; font-weight: bold;"></p>
        <p style="text-align: center;">Pontuação Final: <span id="final-score">0</span></p>
    </div>

    <div class="shortcut">
        Pressione as teclas <strong>1 + 2 + 3</strong> juntas para retornar ao
        <strong>Painel José Teixeira Fialho</strong>
    </div>

    <script src="script-dua.js"></script>

<style>
    /* Estilização do Atalho como Rodapé */
    .shortcut {
        position: fixed;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        color: #333; /* Fonte escura para contraste com o fundo e0e0e0 */
        font-family: 'Poppins', sans-serif;
        z-index: 100;
    }

    /* Garante que em telas pequenas ele não sobreponha o conteúdo principal */
    @media (max-height: 700px) {
        .shortcut {
            position: relative;
            margin-top: 20px;
            bottom: 0;
        }
        body {
            overflow-y: auto;
            height: auto;
            padding: 20px 0;
        }
    }
</style>

<script>
    const teclasPressionadas = new Set();
    let respostaVisivel = false;

    window.addEventListener('keydown', (e) => {
        teclasPressionadas.add(e.key);

        if (teclasPressionadas.has('1') && teclasPressionadas.has('5') && teclasPressionadas.has('9') && !respostaVisivel) {
            const elementoResposta = document.getElementById('resposta-texto');
            if (elementoResposta) {
                elementoResposta.style.display = 'block';
                respostaVisivel = true;
            }
        }

        if (teclasPressionadas.has('1') && teclasPressionadas.has('2') && teclasPressionadas.has('3')) {
            window.location.href = "https://juniorcriste.github.io/Painel-Interativo/";
        }
    });

    window.addEventListener('keyup', (e) => {
        teclasPressionadas.delete(e.key);
    });
</script>
    
</body>
</html>
