<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio 100% Capixaba!</title>
    <!-- Logo no Favicon -->
    <link rel="icon" href="img/radiocapixaba.png" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="bg-overlay"></div>

    <div class="main-wrapper">
        <div class="player-container">
            <span class="status-badge" id="radio-status">● AO VIVO</span>
            
            <!-- Container com Capa e Logo alternando via Fade -->
            <div class="album-wrapper">
                <img src="placeholder.jpg" id="album-cover" class="album-art active" alt="Capa do Álbum">
                <img src="img/radiocapixaba.png" id="radio-logo" class="album-art" alt="Logo Rádio Capixaba">
            </div>

            <h1 id="track-title">Sintonizando...</h1>
            <p id="track-artist">Aguarde</p>
            
            <div id="info-container">
                <h3>Sobre o Artista</h3>
                <p id="artist-info">Carregando curiosidades...</p>
            </div>

            <button class="btn-play" id="main-button" onclick="toggleRadio()">OUVINDO AGORA</button>
            <audio id="audio-element" preload="auto"></audio>
        </div>


        <p class="footer-instruction">
            Pressione as teclas <strong>1 + 2 + 3</strong> juntas para retornar ao <strong>Painel José Teixeira Fialho</strong>
        </p>


        <footer class="footer-credits">
            Rádio 100% Capixaba - v 1.5 - Junior Criste - 2026 (<a href="https://github.com/JuniorCriste" target="_blank" rel="noopener noreferrer">github.com/JuniorCriste</a>)
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
