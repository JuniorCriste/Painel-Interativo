            padding: 40px;
            margin: 40px 20px;

            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -1px;

            justify-content: space-between;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            padding: 5px 0;
            margin-top: 10px;

            font-style: italic;
            font-size: 0.9rem;

            text-align: justify;

            margin-top: 25px;
            min-height: 250px;
        }

        #noticia::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            line-height: 1;
            padding-right: 8px;
            color: #000;
        }

            margin-top: 30px;
            font-family: 'Old Standard TT', serif;
            font-weight: bold;
            text-transform: uppercase;
            border-top: 2px double #1a1a1a;
            padding-top: 10px;
            text-align: right;
            font-size: 0.8rem;
        }

        .footer-info {
            margin-top: auto;
            padding: 20px;
            font-family: 'Old Standard TT', serif;
            font-size: 20px;
            color: #555;
            text-align: center;
            border-top: 1px solid #ccc;
            width: 100%;

        strong {
            color: #000;

</head>

        { txt: "Cientistas descobrem enzima que recicla poliéster em minutos.\nA descoberta pode acabar com o lixo têxtil em aterros.\nO processo é circular, permitindo criar novas roupas do zero.\nGrandes marcas de moda já planejam adotar a tecnologia.\nA poluição por microplásticos de roupas pode diminuir muito.\nO consumo de energia no processo de reciclagem é baixo.\nA química verde encontra soluções para a moda sustentável.\nMenos extração de petróleo para produzir fibras sintéticas.\nUma revolução para a economia circular da indústria têxtil.\nO lixo de hoje se torna a matéria-prima de amanhã.", fonte: "Fonte: Nature" },
        { txt: "Escolas no Japão ensinam felicidade e empatia como matérias.\nO currículo foca em inteligência emocional e bondade.\nAlunos aprendem a lidar com frustrações de forma positiva.\nO bullying nas escolas participantes caiu drasticamente.\nA saúde mental das crianças é tratada como prioridade máxima.\nProfessores relatam que o ambiente escolar ficou mais leve.\nO sucesso acadêmico também melhorou com alunos mais felizes.\nEducar o coração é tão importante quanto educar a mente.\nUm exemplo que está inspirando educadores em todo o globo.\nFormando cidadãos mais conscientes, calmos e resilientes.", fonte: "Fonte: Japan Times" },
        { txt: "A tecnologia de fusão nuclear atingiu um novo recorde de energia.\nCientistas conseguiram manter a reação por mais tempo que antes.\nA fusão promete energia infinita, limpa e sem resíduos.\nÉ o mesmo processo que alimenta as estrelas e o nosso Sol.\nEmbora em teste, o avanço é um salto para a humanidade.\nNão depende de condições climáticas como o sol ou vento.\nO investimento global na área cresceu bilhões este ano.\nPodemos estar perto de resolver a crise energética para sempre.\nA física moderna abre portas para um futuro sem poluição.\nUm marco tecnológico que mudará a história da civilização.", fonte: "Fonte: Physics Today" },
        { txt: "A população de gorilas-das-montanhas subiu para mais de mil.\nA espécie saiu do risco crítico de extinção recentemente.\nO trabalho de guardas florestais na África foi fundamental.\nO turismo consciente gera recursos para proteger o habitat.\nComunidades locais são parceiras na preservação dos animais.\nA caça predatória foi reduzida drasticamente na região.\nVer famílias de gorilas prosperando é uma vitória biológica.\nA natureza retoma sua força quando há proteção real.\nO legado de Dian Fossey continua vivo e dando resultados.\nUma grande notícia para os amantes da vida selvagem.", fonte: "Fonte: African Wildlife Foundation" },
        { txt: "Noruega se torna o primeiro país com mais carros elétricos que a diesel.\nA transição para a mobilidade sustentável foi acelerada.\nO ar nas cidades norueguesas está visivelmente mais limpo.\nO governo oferece incentivos que facilitam a compra dos elétricos.\nA rede de carregamento cobre todo o território nacional.\nRuídos de motores barulhentos sumiram de muitos bairros.\nO país mostra que é possível abandonar o petróleo no transporte.\nOutras nações observam o modelo para aplicar em suas cidades.\nO futuro das estradas é silencioso, limpo e eficiente.\nUm passo gigante para a descarbonização do planeta.", fonte: "Fonte: Reuters Business" },
        { txt: "O maior recife de corais do mundo mostra sinais de regeneração.\nA Grande Barreira de Corais teve o maior crescimento em 36 anos.\nApesar dos desafios térmicos, a vida marinha está lutando.\nNovos corais estão colonizando áreas que estavam mortas.\nCientistas ajudam o processo com técnicas de 'semeadura'.\nA proteção contra a pesca predatória foi intensificada.\nO ecossistema é vital para milhares de espécies de peixes.\nA resiliência da natureza nos surpreende positivamente.\nTuristas são educados para preservar a beleza subaquática.\nO azul do oceano ganha cores vibrantes novamente.", fonte: "Fonte: Marine Conservation Society" },
        { txt: "Um novo tratamento para Alzheimer mostrou resultados promissores.\nO medicamento consegue reduzir o declínio cognitivo inicial.\nMilhões de famílias ganham uma nova esperança contra a doença.\nA ciência foca agora em diagnósticos cada vez mais precoces.\nInvestimentos em pesquisa cerebral nunca foram tão altos.\nO bem-estar dos idosos é o objetivo principal dos médicos.\nCada descoberta nos deixa mais perto de uma cura definitiva.\nA qualidade de vida dos pacientes pode ser prolongada por anos.\nA medicina geriátrica celebra este avanço histórico e humano.\nA memória e a dignidade ganham um novo aliado tecnológico.", fonte: "Fonte: Healthline" },
        { txt: "O uso de sacolas plásticas caiu 80% em países que aplicam taxas.\nA mudança de hábito dos consumidores foi rápida e eficaz.\nBolsas reutilizáveis tornaram-se o novo padrão nas compras.\nMenos lixo plástico termina nos rios e estômagos de animais.\nA indústria está migrando para embalagens de papel e tecido.\nCidades estão banindo plásticos de uso único em eventos.\nA conscientização ambiental gera resultados práticos imediatos.\nO planeta agradece cada sacola que deixa de ser produzida.\nUm pequeno esforço individual gera um impacto global imenso.\nO consumo consciente veio para ficar e transformar o mundo.", fonte: "Fonte: The Economist" },
        { txt: "Pequenos agricultores estão usando IA para economizar 50% de água.\nAplicativos simples ajudam a saber o momento exato de irrigar.\nIsso garante colheitas melhores com menos desperdício.\nA tecnologia chegou ao campo de forma acessível e barata.\nO solo permanece fértil por mais tempo com a umidade correta.\nA segurança alimentar de vilarejos está sendo fortalecida.\nA agricultura de precisão não é mais apenas para grandes fazendas.\nInovação digital ajudando a alimentar o mundo com consciência.\nO campo está ficando mais inteligente e sustentável.\nUm exemplo de como a tecnologia pode servir à terra.", fonte: "Fonte: TechCrunch" },
        { txt: "O número de fumantes no mundo atingiu o nível mais baixo da história.\nCampanhas de saúde pública e restrições ajudaram na queda.\nJovens estão cada vez menos interessados no tabagismo.\nA saúde pulmonar global mostra sinais de melhora geral.\nDoenças relacionadas ao fumo estão diminuindo nos hospitais.\nPaíses investem o dinheiro economizado em outras áreas da saúde.\nA qualidade do ar em locais públicos melhorou para todos.\nUma vitória da conscientização sobre o vício químico.\nA vida sem cigarro traz mais longevidade e disposição.\nO mundo respira melhor com essa tendência positiva.", fonte: "Fonte: WHO" },
        { txt: "Cientistas descobrem como produzir concreto que absorve CO2.\nO novo material ajuda a limpar a atmosfera enquanto endurece.\nA construção civil pode deixar de ser uma das mais poluentes.\nPrédios e pontes funcionarão como filtros de poluição urbanos.\nO concreto é tão resistente quanto o modelo tradicional.\nCidades inteiras podem ajudar a combater o efeito estufa.\nA engenharia de materiais está revolucionando a arquitetura.\nO custo de produção está se tornando competitivo no mercado.\nConstruir o futuro agora significa também limpar o passado.\nUma inovação sólida para um planeta mais sustentável.", fonte: "Fonte: Science Magazine" },
        { txt: "Uma nova técnica de plantio de corais está salvando recifes.\nFragmentos são cultivados em laboratório e levados ao mar.\nO crescimento é dez vezes mais rápido que o natural.\nEquipes de mergulhadores voluntários ajudam no transplante.\nA vida marinha retorna para as áreas reflorestadas em meses.\nO projeto está sendo expandido para o Caribe e Sudeste Asiático.\nOs oceanos ganham uma nova chance de manter seu equilíbrio.\nA biodiversidade subaquática é essencial para o clima da Terra.\nA ciência e o voluntariado unidos pela proteção dos mares.\nCores vibrantes voltando a brilhar sob as ondas.", fonte: "Fonte: Ocean Conservancy" },
        { txt: "A energia das marés começa a ser usada em larga escala na Escócia.\nTurbinas subaquáticas geram eletricidade constante e limpa.\nDiferente do sol, as marés são previsíveis e nunca param.\nA tecnologia não interfere na vida marinha local.\nÉ uma nova fronteira para as energias renováveis globais.\nO custo da tecnologia está baixando com a produção em massa.\nIlhas remotas podem se tornar autossuficientes em energia.\nO poder do oceano servindo à humanidade de forma ética.\nMais uma arma contra a dependência de combustíveis fósseis.\nO futuro energético vem das águas profundas e azuis.", fonte: "Fonte: BBC Tech" },
        { txt: "O Brasil é o país que mais recupera embalagens de defensivos no mundo.\nQuase 100% do material é recolhido e reciclado corretamente.\nIsso evita a contaminação do solo e dos lençóis freáticos.\nO sistema de logística reversa brasileiro é modelo global.\nAgricultores, indústria e governo trabalham em harmonia.\nO material reciclado volta ao mercado como novos produtos.\nA sustentabilidade no campo é um compromisso levado a sério.\nMenos resíduos perigosos descartados na natureza.\nUma vitória da organização e responsabilidade ambiental.\nO agronegócio mostrando seu lado consciente e moderno.", fonte: "Fonte: InpEV" },
        { txt: "Cidades na China reduziram a poluição do ar em 40% em sete anos.\nO governo substituiu o carvão por gás e energias limpas.\nO céu azul voltou a ser comum em metrópoles como Pequim.\nA saúde respiratória da população melhorou significativamente.\nÁrvores foram plantadas em massa ao redor dos centros urbanos.\nO investimento em transporte público elétrico foi massivo.\nÉ uma das limpezas ambientais mais rápidas da história.\nO exemplo chinês prova que políticas rígidas funcionam.\nMenos fumaça nas ruas significa mais vida para os cidadãos.\nO combate à poluição é uma prioridade que dá resultados.", fonte: "Fonte: Bloomberg Green" },
        { txt: "Uma empresa criou sapatos feitos inteiramente de chiclete reciclado.\nO material é coletado das ruas e transformado em solas resistentes.\nIsso limpa as calçadas e dá um destino útil ao resíduo.\nO design é moderno e atrai o público jovem e consciente.\nA iniciativa promove a economia circular de forma criativa.\nMenos plástico virgem é usado na fabricação de calçados.\nCada par de sapatos ajuda a remover lixo das cidades.\nO lixo de um se torna o tesouro fashion de outro.\nInovação urbana que une estilo e responsabilidade social.\nCaminhando para um futuro com menos desperdício.", fonte: "Fonte: Fast Company" },
        { txt: "A Finlândia está perto de erradicar a situação de rua.\nO programa 'Housing First' dá uma casa antes de qualquer coisa.\nCom um teto, as pessoas conseguem buscar emprego e saúde.\nO índice de sucesso na reintegração social é altíssimo.\nÉ mais barato para o estado dar uma casa do que manter abrigos.\nA dignidade humana é colocada como base da política pública.\nO modelo está sendo estudado por cidades em todo o mundo.\nNinguém é deixado para trás na sociedade finlandesa.\nA prova de que problemas sociais complexos têm solução.\nUm lar para todos é uma meta possível e humana.", fonte: "Fonte: The Guardian" },
        { txt: "Cientistas criam braço robótico controlado pelo pensamento.\nO sistema usa IA para traduzir sinais cerebrais em movimentos.\nPacientes com paralisia recuperam a autonomia de forma incrível.\nA tecnologia está ficando mais leve, barata e fácil de usar.\nÉ a união definitiva entre medicina, robótica e informática.\nA sensação de tocar e sentir objetos está sendo desenvolvida.\nO futuro da acessibilidade quebra barreiras físicas antes intransponíveis.\nCada teste bem-sucedido é uma vitória da superação humana.\nA ciência devolvendo a liberdade de movimento para muitos.\nUm passo gigante para a inclusão e qualidade de vida.", fonte: "Fonte: MIT Technology Review" },
        { txt: "O número de parques nacionais no mundo cresceu 15% na última década.\nMais áreas de floresta, savana e mar estão protegidas por lei.\nIsso garante a sobrevivência de milhares de espécies raras.\nO ecoturismo nessas áreas gera renda para povos tradicionais.\nA proteção dessas terras ajuda a regular o clima regional.\nGovernos entendem que a natureza preservada é um ativo valioso.\nAs futuras gerações terão mais espaços selvagens para explorar.\nA biodiversidade ganha santuários seguros contra a exploração.\nAumentar o verde no mapa é uma estratégia de sobrevivência.\nO planeta respira melhor com cada novo parque criado.", fonte: "Fonte: National Geographic" },
        { txt: "O transporte público em Luxemburgo é totalmente gratuito para todos.\nO objetivo é reduzir o trânsito e as emissões de carbono.\nQualquer pessoa pode usar trens e ônibus sem pagar passagem.\nO número de carros nas ruas caiu, e a mobilidade melhorou.\nA medida facilita a vida de trabalhadores e estudantes.\nO país se tornou um laboratório vivo de transporte sustentável.\nMenos estresse no trânsito e mais tempo para a vida pessoal.\nA igualdade de acesso à cidade é garantida pelo governo.\nUm exemplo de como investir o dinheiro público em benefício geral.\nA cidade flui melhor quando o transporte é um direito.", fonte: "Fonte: BBC News" },
        { txt: "Cientistas conseguiram reverter o envelhecimento em células humanas.\nA técnica de reprogramação celular devolveu a vitalidade a tecidos.\nNão se trata de imortalidade, mas de curar doenças da idade.\nA ciência da longevidade está avançando a passos largos.\nIsso pode significar o fim de doenças como a degeneração macular.\nO foco é garantir que as pessoas vivam mais e com saúde.\nTestes em laboratório mostram resultados consistentes e seguros.\nA biotecnologia está reescrevendo o que sabemos sobre o tempo.\nUma vida longa e ativa pode ser a realidade do futuro.\nA medicina foca no bem-estar total ao longo de toda a vida.", fonte: "Fonte: ScienceDaily" },
        { txt: "A energia solar residencial no Brasil cresceu 70% este ano.\nMilhares de famílias estão produzindo sua própria eletricidade.\nIsso reduz a pressão sobre as hidrelétricas e o meio ambiente.\nO custo dos painéis solares caiu, facilitando a instalação.\nConsumidores economizam na conta e ajudam o planeta.\nA energia limpa está se democratizando em todas as classes sociais.\nO Brasil se consolida como potência solar pela abundância de luz.\nNovas empresas e empregos de instalação surgem diariamente.\nO telhado de casa virou uma usina de sustentabilidade.\nO sol brilhando a favor da economia e da ecologia.", fonte: "Fonte: ABSOLAR" },
        { txt: "A Islândia é o primeiro país a fechar a fenda salarial de gênero.\nLeis rigorosas garantem que homens e mulheres ganhem o mesmo.\nEmpresas devem provar que pagam salários iguais para funções iguais.\nA medida trouxe mais justiça e eficiência para o mercado.\nA Islândia lidera o ranking de igualdade de gênero há anos.\nA cultura do país valoriza a equidade em todos os setores.\nMulheres ocupam cargos de liderança em níveis recordes.\nA economia prospera quando todos têm oportunidades iguais.\nUm exemplo de justiça social que o mundo precisa seguir.\nIgualdade não é apenas um ideal, é uma prática diária.", fonte: "Fonte: World Economic Forum" },
        { txt: "A população de águias-calvas nos EUA quadruplicou em pouco tempo.\nO símbolo nacional americano saiu da lista de espécies em perigo.\nA proibição de pesticidas tóxicos foi a chave da recuperação.\nHoje é possível vê-las em quase todos os estados do país.\nA proteção dos rios e lagos garantiu alimento para as aves.\nA resiliência da águia-calva é um sucesso da proteção ambiental.\nVer essas aves majestosas voando é sinal de ecossistemas limpos.\nO esforço de décadas de conservação valeu cada centavo.\nA vida selvagem retoma seu lugar quando paramos de envenená-la.\nUma vitória alada para a história da preservação.", fonte: "Fonte: US Fish and Wildlife" },
        { txt: "Drones entregam vacinas e remédios em vilarejos remotos da África.\nA tecnologia supera estradas ruins e reduz o tempo de entrega.\nMilhares de vidas são salvas com acesso rápido a soros e sangue.\nO sistema é autônomo e funciona sob qualquer clima.\nO custo é menor que o transporte terrestre ou por helicóptero.\nPaíses como Ruanda e Gana são pioneiros nessa logística aérea.\nA saúde pública chega onde o asfalto ainda não alcançou.\nInovação salvando vidas no coração das comunidades rurais.\nA tecnologia a serviço da equidade na saúde global.\nO céu agora é um caminho para a cura e a esperança.", fonte: "Fonte: Zipline News" },
        { txt: "O desperdício de alimentos na França caiu com novas leis proibitivas.\nSupermercados são proibidos de jogar comida fora.\nO que sobra deve ser doado para instituições de caridade.\nMilhares de refeições são servidas diariamente com essas doações.\nA medida combate a fome e reduz o lixo orgânico em aterros.\nA conscientização sobre o valor do alimento cresceu na sociedade.\nRestaurantes também adotam práticas de reaproveitamento integral.\nComida no prato é dignidade para quem mais precisa.\nUm modelo simples que poderia acabar com a fome mundial.\nA França lidera o combate ao desperdício com seriedade.", fonte: "Fonte: France 24" },
        { txt: "Cientistas criam 'couro' de cogumelo que é sustentável e luxuoso.\nO material é feito em laboratório a partir do micélio.\nNão envolve sofrimento animal nem produtos químicos tóxicos.\nGrandes grifes de moda já estão lançando bolsas com esse couro.\nA textura é idêntica ao couro tradicional, mas é 100% biodegradável.\nO processo de fabricação consome pouquíssima água e energia.\nA biotecnologia está transformando o consumo de moda.\nPodemos ser elegantes sem destruir o planeta ou os seres vivos.\nO cogumelo é o material do futuro para um design consciente.\nInovação que brota da terra para as passarelas do mundo.", fonte: "Fonte: Vogue Business" },
        { txt: "O Brasil atingiu a menor taxa de mortalidade infantil da história.\nO avanço do saneamento e das vacinas foi determinante.\nAcompanhamento pré-natal de qualidade salvou milhares de bebês.\nA saúde da família chegou às regiões mais isoladas do país.\nProgramas de nutrição infantil reduziram casos de desnutrição.\nO país é exemplo em campanhas de vacinação em massa.\nCada vida preservada é um futuro garantido para a nação.\nO compromisso com a infância gera resultados para gerações.\nCelebrar a vida desde o primeiro sopro é nossa missão.\nUm passo gigante para o desenvolvimento humano brasileiro.", fonte: "Fonte: DataSUS" },
        { txt: "Cidades na Índia estão plantando mini-florestas urbanas.\nUsando o método Miyawaki, as árvores crescem 10 vezes mais rápido.\nO ar fica mais limpo e a temperatura cai em até 5 graus.\nEssas florestas atraem pássaros e borboletas de volta à cidade.\nO projeto envolve moradores locais na manutenção do verde.\nÁreas abandonadas viram pulmões verdes em poucos meses.\nA biodiversidade urbana traz saúde mental para a população.\nO concreto dá lugar à vida selvagem em meio ao caos urbano.\nUma solução simples e rápida para o aquecimento global.\nO verde está reconquistando seu espaço nas metrópoles.", fonte: "Fonte: Times of India" },
        { txt: "Cientistas descobrem estrela que pode explicar a origem da água.\nA descoberta sugere que a água é comum em todo o universo.\nIsso aumenta as chances de encontrarmos vida em outros planetas.\nA astronomia moderna revela os segredos da nossa existência.\nO telescópio James Webb continua enviando dados fascinantes.\nCada nova imagem nos faz sentir mais conectados ao cosmos.\nA curiosidade humana nos leva cada vez mais longe no espaço.\nA ciência espacial vive sua era de ouro com descobertas diárias.\nO universo é um lugar cheio de água e possibilidades de vida.\nSomos feitos de poeira de estrelas e curiosidade infinita.", fonte: "Fonte: NASA" },
        { txt: "A Holanda transformou pontos de ônibus em abrigos para abelhas.\nOs telhados foram cobertos com plantas e flores silvestres.\nIsso ajuda a polinização urbana e combate a queda das abelhas.\nO projeto é barato, bonito e funcional para as cidades.\nAs abelhas têm novos 'oásis' para descansar em meio ao asfalto.\nA ideia está sendo copiada por diversas cidades europeias.\nA natureza pode coexistir com a infraestrutura das cidades.\nUm pequeno gesto que faz uma grande diferença no ecossistema.\nAs cidades holandesas ficaram mais coloridas e vivas.\nProtegendo os pequenos seres que garantem nossa comida.", fonte: "Fonte: Dutch News" },
        { txt: "A nova lei de proteção aos oceanos vai criar santuários gigantes.\n30% das águas globais devem ser protegidas até 2030.\nIsso impedirá a pesca industrial em áreas críticas de reprodução.\nA vida marinha terá espaço para se recuperar totalmente.\nO acordo histórico foi assinado pela maioria dos países da ONU.\nOs oceanos são os maiores reguladores do clima da Terra.\nProteger o azul é garantir a sobrevivência de todos nós.\nA biodiversidade marinha é um tesouro que deve ser guardado.\nA era da exploração desenfreada dos mares está chegando ao fim.\nUma vitória monumental para o futuro do planeta Terra.", fonte: "Fonte: Greenpeace" },
        { txt: "Cientistas desenvolvem trigo que resiste a secas extremas.\nA nova variedade pode garantir comida em regiões desérticas.\nIsso combate a fome causada pelas mudanças climáticas.\nO trigo mantém o valor nutricional e o sabor tradicional.\nA agricultura se adapta para alimentar uma população crescente.\nA biotecnologia vegetal é fundamental para a segurança alimentar.\nPaíses da África e Oriente Médio serão os maiores beneficiados.\nA ciência garante que o pão não falte na mesa das pessoas.\nInovação no campo para enfrentar os desafios do clima.\nO alimento do futuro está sendo semeado com tecnologia hoje.", fonte: "Fonte: Reuters Science" },
        { txt: "Escolas na Escócia são as primeiras a ensinar direitos LGBTQ+.\nO currículo promove a inclusão, o respeito e a diversidade.\nO objetivo é acabar com o preconceito desde a infância.\nAlunos aprendem sobre a história e as conquistas do movimento.\nO ambiente escolar se torna mais seguro para todos os jovens.\nA educação é a arma mais poderosa contra a intolerância.\nA Escócia lidera o ranking de países mais inclusivos da Europa.\nRespeitar a identidade de cada um é um valor fundamental.\nFormando uma geração mais empática e livre de ódio.\nA diversidade é celebrada como uma riqueza da sociedade.", fonte: "Fonte: BBC Scotland" },
        { txt: "Cientistas criam vidro que gera energia solar e é transparente.\nEle pode substituir as janelas de prédios e gerar eletricidade.\nArranha-céus podem se tornar usinas de energia autossuficientes.\nO vidro não distorce a visão e funciona mesmo em dias nublados.\nÉ uma revolução para a arquitetura sustentável em cidades.\nA tecnologia está pronta para ser produzida em escala comercial.\nMenos fios e mais energia limpa vindo das próprias paredes.\nA estética e a funcionalidade unidas pelo meio ambiente.\nAs cidades do futuro serão brilhantes e energizadas pelo sol.\nUma inovação clara para um futuro energético sustentável.", fonte: "Fonte: Popular Science" },
        { txt: "A população de rinocerontes negros está crescendo lentamente.\nApós anos de queda, os números mostram uma recuperação real.\nO combate ao tráfico de chifres foi intensificado com drones.\nReservas privadas e públicas trabalham juntas na proteção.\nA genética da espécie está sendo preservada em bancos de dados.\nVer um rinoceronte na savana é uma experiência emocionante.\nA luta contra a extinção está sendo vencida dia após dia.\nA conservação animal é um dever ético da nossa geração.\nA natureza mostra que ainda há tempo para salvar as espécies.\nA esperança corre solta pelas planícies africanas.", fonte: "Fonte: Save the Rhino" },
        { txt: "Um aplicativo brasileiro ajuda a evitar o desperdício de comida.\nRestaurantes vendem alimentos excedentes com 70% de desconto.\nO consumidor economiza e a comida não vai para o lixo.\nMilhares de toneladas de alimentos já foram salvas pelo app.\nA iniciativa gera lucro para o comércio e ajuda o planeta.\nÉ a tecnologia conectando fome, economia e consciência.\nA economia circular na palma da mão de cada cidadão.\nMenos lixo nos aterros e mais comida boa sendo aproveitada.\nUm exemplo de como a inovação pode resolver problemas reais.\nO sucesso do aplicativo mostra que todos querem ajudar.", fonte: "Fonte: G1 Economia" },
        { txt: "Cientistas descobrem nova espécie de orquídea na Amazônia.\nA flor tem cores únicas e propriedades medicinais em estudo.\nIsso mostra que a floresta ainda guarda muitos segredos.\nA biodiversidade brasileira é a maior e mais rica do mundo.\nCada descoberta reforça a necessidade de proteger a mata.\nPesquisadores trabalham para catalogar a fauna e flora local.\nA Amazônia é uma biblioteca viva de ciência e vida.\nProteger a floresta é garantir o futuro da medicina natural.\nA beleza da natureza se revela em cada pétala descoberta.\nA vida floresce onde o ser humano decide preservar.", fonte: "Fonte: INPA" },
        { txt: "O número de bibliotecas comunitárias cresceu no Brasil.\nProjetos em favelas e periferias levam livros para todos.\nA leitura transforma a realidade de crianças e jovens.\nEspaços de cultura nascem da vontade dos próprios moradores.\nO acesso ao conhecimento é a base da mudança social.\nLivros doados circulam e ganham novas vidas em cada mão.\nBibliotecas se tornam centros de apoio e aprendizado coletivo.\nA literatura abre portas para mundos e sonhos novos.\nUm país que lê é um país que pensa e se desenvolve.\nA magia das histórias unindo comunidades inteiras.", fonte: "Fonte: Brasil de Fato" },
        { txt: "Pela primeira vez, a malária foi erradicada em um país africano.\nCabo Verde recebeu o certificado de país livre da doença.\nO esforço de décadas em saneamento e prevenção deu certo.\nÉ um marco histórico para a saúde pública em todo o continente.\nOutros países estão usando o modelo cabo-verdiano para avançar.\nA saúde global celebra essa vitória contra um inimigo antigo.\nVidas de crianças e trabalhadores estão protegidas agora.\nA erradicação é possível com foco, investimento e ciência.\nUm exemplo de perseverança e sucesso na medicina preventiva.\nCabo Verde brilha como um farol de saúde para a África.", fonte: "Fonte: OMS" },
        { txt: "Cientistas criam plástico que se dissolve na água e vira comida de peixe.\nFeito de amido de mandioca, o material é totalmente inofensivo.\nSe chegar ao oceano, ele some em minutos sem poluir.\nJá está sendo usado para embalar roupas e objetos secos.\nPodemos acabar com a 'ilha de plástico' se mudarmos o material.\nA solução para o lixo marinho pode vir da agricultura.\nInovação barata, eficiente e amiga dos animais marinhos.\nO fim das sacolas eternas está mais perto do que imaginamos.\nA natureza agradece por materiais que não duram 500 anos.\nUm brinde de água limpa para o futuro dos nossos oceanos.", fonte: "Fonte: Discovery Channel" },
        { txt: "A energia solar agora é a fonte de eletricidade mais barata da história.\nProduzir energia do sol custa menos que carvão ou gás hoje.\nIsso está acelerando a transição energética em países pobres.\nA conta de luz global tende a cair com a adoção do solar.\nInvestidores estão migrando em massa para projetos limpos.\nO planeta respira melhor com menos queima de combustíveis.\nO sol é um recurso democrático disponível para todos.\nA tecnologia solar evoluiu para ser eficiente e acessível.\nO fim da era do carbono está sendo ditado pela economia.\nUm futuro brilhante e barato movido pela luz solar.", fonte: "Fonte: International Energy Agency" },
        { txt: "Cientistas desenvolvem técnica que limpa o sangue de bactérias.\nUm pequeno filtro magnético remove infecções em poucas horas.\nIsso pode salvar pacientes com sepse em estado crítico.\nA medicina de emergência ganha uma ferramenta poderosa.\nA tecnologia é inspirada no funcionamento do baço humano.\nTestes clínicos mostram alta taxa de sobrevivência.\nMenos dependência de antibióticos potentes e invasivos.\nA engenharia biomédica salvando vidas nos hospitais.\nUma vitória da ciência contra as infecções generalizadas.\nO sangue limpo traz de volta a esperança de recuperação.", fonte: "Fonte: Medical News Today" },
        { txt: "A população de linces-ibéricos cresceu dez vezes em vinte anos.\nO felino mais ameaçado do mundo está voltando à natureza.\nEspanha e Portugal trabalharam juntos na reintrodução.\nO habitat foi recuperado e os coelhos, sua comida, protegidos.\nVer o lince caçar livremente é um triunfo da biologia.\nA conservação prova que espécies à beira da extinção podem voltar.\nA biodiversidade da Península Ibérica está mais rica e equilibrada.\nO lince é um símbolo de orgulho e preservação ambiental.\nUm sucesso que inspira projetos em todo o continente europeu.\nO olhar do lince brilha novamente entre os arbustos.", fonte: "Fonte: El País" },
        { txt: "Cientistas criam 'folha artificial' que produz combustível do sol.\nA folha absorve CO2 e água para gerar energia limpa.\nO processo imita a fotossíntese das plantas reais.\nO combustível gerado pode ser usado em carros e aviões.\nIsso ajudaria a zerar as emissões de carbono no transporte.\nA tecnologia é compacta e pode ser instalada em qualquer lugar.\nA ciência está aprendendo com a perfeição da natureza.\nEnergia limpa vinda diretamente do ar e da luz solar.\nUma revolução química para um planeta mais verde.\nO futuro do combustível é verde e cresce como uma planta.", fonte: "Fonte: Cambridge University" },
        { txt: "O Brasil é o maior reciclador de latas de alumínio do mundo.\nReciclamos quase 100% das latas que são colocadas no mercado.\nIsso economiza energia e evita a extração de bauxita.\nMilhares de famílias vivem da coleta e reciclagem no país.\nO sistema é um exemplo de economia circular e social.\nA latinha que você bebe hoje pode virar uma nova em 60 dias.\nO alumínio é infinitamente reciclável sem perder a qualidade.\nO Brasil lidera o ranking mundial há mais de uma década.\nSustentabilidade e renda caminhando juntas com sucesso.\nOrgulho nacional em responsabilidade ambiental e social.", fonte: "Fonte: Abralatas" },
        { txt: "Cientistas descobrem como transformar ruído urbano em energia.\nPlacas especiais captam a vibração do som e geram eletricidade.\nO barulho das ruas pode carregar postes e semáforos.\nCidades barulhentas podem se tornar fontes de energia limpa.\nA tecnologia é silenciosa em sua operação e muito eficiente.\nA poluição sonora ganha uma utilidade prática e positiva.\nInovação física que transforma um problema em solução.\nO futuro das cidades é aproveitar cada recurso disponível.\nMenos desperdício de energia e mais inteligência urbana.\nO som da cidade agora é sinônimo de luz e energia.", fonte: "Fonte: Scientific American" },
        { txt: "A vacina contra a dengue no Brasil reduz hospitalizações em 90%.\nA campanha pública de vacinação está salvando milhares de pessoas.\nCrianças e jovens são os primeiros a receber a proteção.\nO número de casos graves caiu drasticamente em cidades testadas.\nA ciência brasileira e internacional vencendo uma doença antiga.\nPrevenção é o melhor caminho para um verão mais tranquilo.\nA saúde pública se fortalece com a ciência e a confiança.\nMenos filas nos hospitais e mais saúde para a população.\nUma vitória da medicina preventiva para todo o povo brasileiro.\nO mosquito perde a batalha para a vacina e o cuidado.", fonte: "Fonte: Anvisa" },
        { txt: "Cientistas criam tecido que esfria o corpo em dias de calor.\nO material reflete a luz solar e dissipa o calor humano.\nIsso pode reduzir o uso de ar-condicionado em prédios.\nRoupas feitas desse tecido trazem conforto térmico extremo.\nA tecnologia é baseada na nanoestrutura de fibras naturais.\nIdeal para atletas e pessoas que trabalham sob o sol.\nA ciência ajudando o ser humano a se adaptar ao aquecimento.\nConforto e sustentabilidade em cada fibra da roupa.\nO futuro da moda é funcional, inteligente e refrescante.\nMenos gasto de energia para manter o corpo fresco.", fonte: "Fonte: Science" },
        { txt: "A Islândia vai plantar 4 milhões de árvores para recuperar solo.\nO país quer trazer de volta as florestas que tinha há mil anos.\nO plantio ajuda a evitar a erosão e a capturar carbono.\nVoluntários e governo trabalham juntos no grande reflorestamento.\nA paisagem vulcânica está ganhando tons de verde intenso.\nAs novas florestas protegem a agricultura e as estradas.\nA natureza está sendo reconstruída com paciência e foco.\nUm exemplo de como recuperar ecossistemas degradados.\nO ar da Islândia ficará ainda mais puro com as novas matas.\nO legado verde para as próximas gerações islandesas.", fonte: "Fonte: Iceland Review" },
        { txt: "Cientistas desenvolvem técnica para curar cegueira hereditária.\nTerapia genética consegue restaurar a visão em pacientes jovens.\nO tratamento corrige a falha no DNA das células da retina.\nA emoção de ver o mundo pela primeira vez é indescritível.\nA ciência médica está superando limites antes considerados finais.\nNovos testes estão sendo aprovados para outras doenças oculares.\nA tecnologia servindo para devolver a luz e as cores às pessoas.\nUm marco na oftalmologia e na genética moderna.\nA vida ganha um novo brilho para quem recupera a visão.\nO futuro da saúde é ver além das dificuldades de hoje.", fonte: "Fonte: BBC Health" },
        { txt: "A cidade de Paris terá a maior fazenda urbana do mundo.\nO telhado de um centro de exposições virou uma horta gigante.\nLegumes e frutas serão colhidos e vendidos no próprio bairro.\nIsso reduz a poluição do transporte de alimentos longos.\nA agricultura urbana traz frescor e saúde para o centro da cidade.\nO projeto usa técnicas que economizam 90% de água.\nMoradores podem alugar espaços para plantar suas próprias hortas.\nA conexão com a terra é mantida mesmo em uma metrópole.\nParis ficando mais verde, produtiva e sustentável.\nComida fresca crescendo logo acima das nossas cabeças.", fonte: "Fonte: Le Monde" },
        { txt: "Cientistas criam impressora 3D que produz órgãos humanos.\nA bioimpressão usa células do próprio paciente para evitar rejeição.\nNo futuro, as filas de transplante podem deixar de existir.\nCorações, rins e fígados poderão ser impressos sob medida.\nA medicina regenerativa está vivendo um avanço sem precedentes.\nTestes com tecidos de pele já estão salvando vítimas de queimaduras.\nA tecnologia parece ficção científica, mas é realidade laboratorial.\nA vida humana ganha novos horizontes com a engenharia de tecidos.\nInovação salvando vidas com precisão e biotecnologia.\nO corpo humano ganhando peças de reposição naturais e seguras.", fonte: "Fonte: Wired Science" },
        { txt: "A população de baleias-azuis no oceano Índico está crescendo.\nApós décadas de silêncio, o maior animal do mundo voltou.\nCensos marítimos confirmam grupos de mães e filhotes.\nA proibição da caça permitiu que o gigante se recuperasse.\nElas são fundamentais para o equilíbrio térmico dos oceanos.\nOuvir o canto de uma baleia-azul é uma vitória da conservação.\nA majestade da natureza retomando seu trono nos mares.\nOs oceanos estão mais vivos com a presença dessas gigantes.\nA proteção marinha funciona e os resultados são colossais.\nA esperança é tão grande quanto o tamanho desse animal.", fonte: "Fonte: Marine Biology" },
        { txt: "Escolas na Finlândia ensinam os alunos a detectar notícias falsas.\nA educação midiática é parte do currículo desde cedo.\nCrianças aprendem a checar fontes e a pensar criticamente.\nO país tem os menores índices de desinformação do mundo.\nA democracia se fortalece com cidadãos bem informados.\nSaber o que é verdade é uma habilidade essencial no século 21.\nO modelo finlandês está sendo estudado por diversos governos.\nA escola prepara os jovens para navegar na internet com segurança.\nMenos mentiras e mais fatos construindo a opinião pública.\nA verdade é a base de uma sociedade justa e funcional.", fonte: "Fonte: CNN International" },
        { txt: "Cientistas descobrem como transformar lixo plástico em diamantes.\nUsando lasers potentes, o carbono do plástico é comprimido.\nOs diamantes podem ser usados em eletrônicos e na indústria.\nO lixo mais comum se torna o material mais valioso.\nIsso incentiva a coleta de plásticos em todo o mundo.\nA física de alta pressão revelando soluções para o lixo.\nInovação que brilha tanto quanto o resultado final.\nPodemos limpar o planeta e gerar valor ao mesmo tempo.\nTransformar poluição em pedras preciosas é alquimia moderna.\nA ciência transformando o que é descartado em algo eterno.", fonte: "Fonte: Nature Communications" },
        { txt: "A energia eólica offshore pode alimentar o mundo inteiro 18 vezes.\nO potencial dos ventos nos oceanos é vasto e inexplorado.\nNovas turbinas flutuantes permitem instalar em águas profundas.\nA tecnologia é limpa e não ocupa espaço terrestre valioso.\nPaíses costeiros estão investindo pesado nessa fonte infinita.\nO mar se torna a maior usina de energia do planeta Terra.\nA transição energética global ganha um impulso oceânico.\nMenos petróleo e mais vento soprando a favor do clima.\nO poder da natureza servindo à humanidade com respeito.\nEnergia limpa vindo do horizonte azul dos nossos mares.", fonte: "Fonte: IEA Report" },
        { txt: "O Brasil tem a maior frota de ônibus elétricos da América Latina.\nCidades estão substituindo o diesel por baterias limpas.\nO ar nos terminais de ônibus está mais puro e silencioso.\nIsso reduz doenças respiratórias em motoristas e passageiros.\nO transporte público elétrico é o futuro da mobilidade urbana.\nO Brasil produz sua própria tecnologia de baterias e motores.\nA economia com combustível paga o investimento em poucos anos.\nMenos fumaça preta nas ruas das nossas grandes cidades.\nO passageiro viaja com mais conforto, silêncio e consciência.\nA mobilidade brasileira acelerando rumo à sustentabilidade.", fonte: "Fonte: ANTP" },
        { txt: "Cientistas descobrem bactéria que cura cáries naturalmente.\nA bactéria 'boa' impede que as 'ruins' destruam o esmalte.\nIsso pode revolucionar a saúde bucal em todo o mundo.\nO tratamento seria simples, como um enxaguante bucal.\nMenos dor e menos idas ao dentista para procedimentos chatos.\nA prevenção biológica é o futuro da odontologia moderna.\nA ciência focada no bem-estar e no sorriso das pessoas.\nSaúde bucal acessível para quem não pode pagar tratamentos.\nUma descoberta minúscula com um impacto gigante na vida.\nO sorriso humano mais protegido pela própria natureza.", fonte: "Fonte: Journal of Dental Research" },
        { txt: "A população de papagaios-verdadeiros no Brasil está em alta.\nProjetos de proteção de ninhos garantiram o nascimento de milhares.\nA fiscalização contra o tráfico de aves foi intensificada.\nAs comunidades locais ajudam a vigiar as áreas de reprodução.\nVer as cores dessas aves no céu é uma alegria para a fauna.\nA biodiversidade brasileira sendo preservada com amor e rigor.\nO papagaio é um símbolo da nossa fauna que volta a brilhar.\nA natureza agradece quando o ser humano atua como guardião.\nAs florestas estão mais barulhentas e coloridas hoje.\nUma vitória do meio ambiente e da vida selvagem nacional.", fonte: "Fonte: Projeto Papagaio-Verdadeiro" },
        { txt: "Cientistas criam tinta que resfria prédios em até 10 graus.\nA tinta 'mais branca do mundo' reflete 98% da luz solar.\nIsso reduz drasticamente a necessidade de ar-condicionado.\nCidades pintadas de branco podem ajudar a resfriar o planeta.\nO custo da tinta é similar ao das tintas tradicionais.\nUma solução passiva, simples e barata para o calor urbano.\nA arquitetura sustentável ganha uma aliada poderosa e clara.\nMenos consumo de energia e mais conforto dentro de casa.\nA ciência pintando um futuro mais fresco para todos nós.\nO branco da esperança combatendo o aquecimento global.", fonte: "Fonte: Purdue University" },
        { txt: "O número de transplantes de coração bateu recorde no Brasil.\nA agilidade no transporte aéreo de órgãos foi a chave do sucesso.\nA solidariedade das famílias brasileiras continua crescendo.\nNovos protocolos médicos aumentaram o sucesso das cirurgias.\nMilhares de pessoas ganharam uma segunda chance de viver.\nO SUS realiza a maioria desses procedimentos de alta complexidade.\nO coração de um doador batendo forte em um novo peito.\nA vida se renova através do avanço técnico e do amor ao próximo.\nO Brasil é referência mundial em saúde pública e doação.\nUm batimento de esperança para milhares de famílias.", fonte: "Fonte: Ministério da Saúde" },
        { txt: "Cientistas descobrem fungo que decompõe bitucas de cigarro.\nO fungo transforma o filtro tóxico em material orgânico limpo.\nIsso resolve um dos maiores problemas de lixo nas calçadas.\nAs bitucas deixam de poluir o solo e os oceanos com veneno.\nA natureza oferecendo soluções biológicas para o lixo humano.\nInovação que pode ser aplicada em cinzeiros públicos urbanos.\nMenos resíduos químicos sendo levados pela água da chuva.\nA micologia revelando segredos incríveis para a ecologia.\nLimpar as cidades ficou mais fácil com a ajuda dos fungos.\nA vida microscópica trabalhando pela limpeza do planeta.", fonte: "Fonte: ScienceDaily" },
        { txt: "A Suíça proibiu a fervura de lagostas vivas por ética animal.\nA lei exige que os animais sejam atordoados antes do preparo.\nO país reconhece que crustáceos sentem dor e sofrimento.\nÉ um passo importante para o bem-estar animal na gastronomia.\nA cultura do respeito à vida se estende a todos os seres.\nOutros países estão considerando adotar leis semelhantes.\nA ética deve estar presente em todos os aspectos da nossa vida.\nTratar todos os seres com dignidade é um sinal de evolução.\nA gastronomia moderna pode ser deliciosa e humana ao mesmo tempo.\nUma vitória da compaixão e da consciência animal.", fonte: "Fonte: Swiss Info" },
        { txt: "Cientistas criam bateria que carrega em 5 minutos e dura 20 anos.\nA tecnologia usa nanossistemas para acelerar a carga.\nCarros elétricos poderão ser carregados no tempo de um café.\nIsso acaba com a 'ansiedade de autonomia' dos motoristas.\nA bateria é feita de materiais mais abundantes e menos tóxicos.\nA mobilidade elétrica ganha o impulso que faltava para dominar.\nA eletrônica de consumo também será beneficiada com celulares assim.\nInovação energética que economiza tempo e recursos do planeta.\nO futuro não precisa esperar horas para estar pronto para rodar.\nA velocidade da carga a serviço da sustentabilidade.", fonte: "Fonte: Tech Radar" },
        { txt: "A população de abelhas nos EUA teve o maior aumento em 20 anos.\nApicultores e cientistas conseguiram reverter o colapso das colônias.\nNovas técnicas de manejo e flores silvestres ajudaram as abelhas.\nA polinização das lavouras americanas está mais garantida hoje.\nO mel voltou a ser produzido em quantidades recordes e saudáveis.\nA biodiversidade agradece a volta das pequenas trabalhadoras.\nSem abelhas não há comida, e hoje elas estão mais fortes.\nO esforço de conscientização dos fazendeiros deu resultados.\nZumbidos alegres ecoando pelos campos e plantações.\nUma notícia doce para o equilíbrio do meio ambiente.", fonte: "Fonte: USDA Report" },
        { txt: "Cientistas descobrem como fazer combustível de aviação com lixo.\nRestos de comida e esgoto são transformados em querosene limpo.\nIsso pode reduzir as emissões dos voos em até 80%.\nGrandes companhias aéreas já estão testando o novo combustível.\nVoar pode deixar de ser um peso para o aquecimento global.\nA economia circular chegando aos céus de todo o mundo.\nTransformar o que ninguém quer em energia para viajar.\nInovação química que une transporte e sustentabilidade.\nO céu fica mais limpo a cada decolagem com biocombustível.\nO lixo da cidade agora ajuda a humanidade a voar alto.", fonte: "Fonte: Sky News" },
        { txt: "A cidade de Bogotá criou 600km de ciclovias para seus moradores.\nÉ a maior rede de caminhos para bicicletas da América Latina.\nO trânsito melhorou e a poluição do ar caiu visivelmente.\nAs pessoas estão mais saudáveis e economizam com transporte.\nA bicicleta se tornou o símbolo da mobilidade urbana moderna.\nOutras cidades estão copiando o modelo de sucesso colombiano.\nMenos carros e mais pedaladas para um dia a dia melhor.\nA cidade pertence às pessoas, não apenas aos veículos.\nA vida flui com mais energia e liberdade sobre duas rodas.\nUm exemplo de urbanismo focado no bem-estar humano.", fonte: "Fonte: El Tiempo" },
        { txt: "Cientistas criam robô que faz companhia para idosos solitários.\nO robô conversa, lembra de remédios e detecta quedas.\nA tecnologia combate a solidão e aumenta a segurança em casa.\nÉ um assistente carinhoso e inteligente para a terceira idade.\nA inteligência artificial servindo para conectar e cuidar.\nFamílias ficam mais tranquilas com o suporte tecnológico.\nO robô não substitui humanos, mas preenche vazios diários.\nA saúde mental dos idosos melhora com a interação constante.\nInovação com coração para cuidar de quem já cuidou de nós.\nA tecnologia envelhecendo junto com a gente de forma digna.", fonte: "Fonte: Robotics World" },
        { txt: "A camada de ozônio sobre o Ártico está se fechando rapidamente.\nCondições climáticas e redução de gases ajudaram no processo.\nO buraco que preocupava os cientistas sumiu recentemente.\nA proteção natural contra raios UV está mais forte naquela região.\nA natureza mostra que ciclos de cura são reais e possíveis.\nO esforço global de preservação continua valendo a pena.\nO topo do mundo está mais seguro para a vida selvagem local.\nUma notícia fresca e positiva vinda das regiões polares.\nO céu azul do Ártico agora é um escudo mais eficiente.\nA esperança ambiental se renova com os dados de satélite.", fonte: "Fonte: Copernicus EU" },
        { txt: "Cientistas criam 'super plantas' que absorvem 30% mais carbono.\nAtravés de melhoramento genético, as raízes ficaram maiores.\nIsso ajuda a fixar o CO2 no solo por muito mais tempo.\nAs plantas também são mais resistentes a pragas e secas.\nFlorestas plantadas com essas espécies podem salvar o clima.\nA biotecnologia agrícola focada na regeneração do planeta.\nA natureza potencializada pela ciência para combater a poluição.\nMais verde e menos carbono no ar que todos respiramos.\nInovação que cresce, floresce e limpa a nossa atmosfera.\nUm passo verde para um futuro climático mais equilibrado.", fonte: "Fonte: Salk Institute" },
        { txt: "A população de castores na Europa voltou aos níveis de 100 anos atrás.\nEles foram reintroduzidos em rios e ajudam a prevenir enchentes.\nSuas represas naturais criam ecossistemas ricos para peixes.\nO castor é um engenheiro da natureza que recupera cursos d'água.\nVer esses animais trabalhando é sinal de rios limpos e saudáveis.\nA biodiversidade europeia está sendo restaurada com sucesso.\nA coexistência entre humanos e castores é harmoniosa e útil.\nA natureza sabe como se cuidar, basta darmos uma chance.\nÁguas mais calmas e vidas mais ricas com a volta dos castores.\nA engenharia natural vencendo os desafios da modernidade.", fonte: "Fonte: BBC Wildlife" },
        { txt: "Brasil lança o maior programa de reflorestamento da sua história.\nMilhões de mudas de árvores nativas serão plantadas em 10 anos.\nO foco é recuperar nascentes e corredores de biodiversidade.\nO projeto gera milhares de empregos verdes para o povo rural.\nA fauna brasileira terá novos lares para crescer e se reproduzir.\nO país reafirma seu papel de líder ambiental no cenário global.\nA floresta do amanhã começa com as sementes que plantamos hoje.\nRecuperar o verde é garantir água e vida para o futuro próximo.\nO Brasil voltando a ser um exemplo de conservação e cuidado.\nA natureza brasileira renascendo com força, cor e esperança.", fonte: "Fonte: Ministério do Meio Ambiente" }
    ];

    function carregarPagina() {
        const index = Math.floor(Math.random() * noticias.length);
        const sorteada = noticias[index];
        document.getElementById('noticia').innerText = sorteada.txt;
        document.getElementById('fonte').innerText = sorteada.fonte;
        
        // Data no topo do jornal
        const data = new Date();
        const opcoes = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('data-atual').innerText = data.toLocaleDateString('pt-BR', opcoes);
    }

    const keysPressed = {};
    document.addEventListener('keydown', (event) => {
        keysPressed[event.key] = true;
        if (keysPressed['1'] && keysPressed['2'] && keysPressed['3']) {
            window.location.href = "https://juniorcriste.github.io/Painel-Interativo/";
        }
    });

    document.addEventListener('keyup', (event) => {
        delete keysPressed[event.key];
    });

    window.onload = carregarPagina;
</script>

</body>
</html>
