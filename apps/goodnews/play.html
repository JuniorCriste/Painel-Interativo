<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Good News Times</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville&display=swap" rel="stylesheet">
    <style>
        body {
            /* Textura de papel jornal antigo */
            background-color: #fdfaf0;
            background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
            color: #1a1a1a;
            font-family: 'Libre+Baskerville', serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Estrutura Principal */
        .container {
            max-width: 800px;
            width: 90%;
            padding: 40px;
            margin: 40px 20px;
            border: 1px solid #d3d3d3;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background: rgba(255, 255, 255, 0.5);
            position: relative;
        }

        /* Cabeçalho do Jornal */
        header {
            text-align: center;
            border-bottom: 4px solid #1a1a1a;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .newspaper-meta {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            padding: 5px 0;
            margin-top: 10px;
            font-family: 'Old Standard TT', serif;
            font-style: italic;
            font-size: 0.9rem;
        }

        /* Conteúdo da Notícia */
        #noticia {
            font-family: 'Old Standard TT', serif;
            font-size: 1.25rem;
            line-height: 1.5;
            text-align: justify;
            column-count: 2; /* Estilo de colunas de jornal */
            column-gap: 30px;
            margin-top: 25px;
            min-height: 250px;
        }

        /* Efeito de Letra Capitular (Primeira letra grande) */
        #noticia::first-letter {
            float: left;
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            line-height: 1;
            padding-right: 8px;
            color: #000;
        }

        #fonte {
            margin-top: 30px;
            font-family: 'Old Standard TT', serif;
            font-weight: bold;
            text-transform: uppercase;
            border-top: 2px double #1a1a1a;
            padding-top: 10px;
            text-align: right;
            font-size: 0.8rem;
        }

        /* Rodapé Informativo */
        .footer-info {
            margin-top: auto;
            padding: 20px;
            font-family: 'Old Standard TT', serif;
            font-size: 0.9rem;
            color: #555;
            text-align: center;
            border-top: 1px solid #ccc;
            width: 100%;
            background: rgba(253, 250, 240, 0.8);
        }

        strong {
            color: #000;
            text-decoration: underline;
        }

        /* Responsividade para telas menores */
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            #noticia { column-count: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>The Good News Times</h1>
        <div class="newspaper-meta">
            <span>Edição Diária Nº 001</span>
            <span id="data-atual"></span>
            <span>Preço: Grátis</span>
        </div>
    </header>

    <div id="noticia">
        </div>
    
    <div id="fonte">
        </div>
</div>

<div class="footer-info">
    Pressione as teclas <strong>1 + 2 + 3</strong> para retornar ao <strong>Painel José Teixeira Fialho</strong>
</div>

<script>
    const noticias = [
        {
            txt: "Cientistas anunciaram que a camada de ozônio está em plena recuperação. Graças ao Protocolo de Montreal, os buracos estão fechando. A expectativa é que ela se recupere totalmente até 2066. Isso prova que a cooperação global funciona para o clima. Milhares de casos de câncer de pele serão evitados anualmente. A fauna e a flora também se beneficiam com menos radiação. O esforço das últimas décadas finalmente mostrou resultados claros. Países reduziram drasticamente o uso de gases CFC nocivos. Este é um marco histórico para a ciência ambiental moderna. Um lembrete de que podemos consertar o planeta se agirmos.",
            fonte: "Publicado por: ONU News"
        },
        {
            txt: "Uma nova vacina contra a malária mostrou eficácia sem precedentes. O imunizante R21/Matrix-M foi aprovado pela OMS recentemente. Ela promete reduzir a mortalidade infantil drasticamente na África. Milhares de vidas de crianças serão salvas todos os anos. A produção em massa já começou para atender regiões críticas. O custo da vacina é acessível para programas de saúde pública. É a primeira vez que chegamos tão perto de erradicar a doença. Cientistas trabalharam décadas para alcançar essa formulação. O impacto socioeconômico nas comunidades será imenso e positivo. A saúde global celebra este avanço tecnológico extraordinário.",
            fonte: "Publicado por: BBC Brasil"
        },
        {
            txt: "A população de tigres selvagens na Índia cresceu significativamente. Censos recentes mostram um aumento de mais de 30% na espécie. Isso é fruto de leis rigorosas contra a caça e preservação. Reservas naturais foram expandidas para garantir o habitat. Comunidades locais agora atuam como guardiãs dos animais. O sucesso do projeto serve de modelo para outros países. O tigre é um animal fundamental para o equilíbrio do ecossistema. Turismo sustentável tem ajudado a financiar a conservação. Ver um predador de topo prosperar é sinal de florestas saudáveis. A biodiversidade indiana respira com mais alívio agora.",
            fonte: "Publicado por: National Geographic"
        }
        // ... (as demais notícias podem ser adicionadas mantendo o formato de parágrafo contínuo para o estilo jornal)
    ];

    function carregarPagina() {
        const index = Math.floor(Math.random() * noticias.length);
        const sorteada = noticias[index];
        document.getElementById('noticia').innerText = sorteada.txt;
        document.getElementById('fonte').innerText = sorteada.fonte;
        
        // Data no topo do jornal
        const data = new Date();
        const opcoes = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('data-atual').innerText = data.toLocaleDateString('pt-BR', opcoes);
    }

    const keysPressed = {};
    document.addEventListener('keydown', (event) => {
        keysPressed[event.key] = true;
        if (keysPressed['1'] && keysPressed['2'] && keysPressed['3']) {
            window.location.href = "https://juniorcriste.github.io/Painel-Interativo/";
        }
    });

    document.addEventListener('keyup', (event) => {
        delete keysPressed[event.key];
    });

    window.onload = carregarPagina;
</script>

</body>
</html>
