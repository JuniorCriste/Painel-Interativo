<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz da Consciência Negra</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="erer-preloader">
        <img src="img/carregando.gif" alt="Carregando...">
        <b>Carregando o Quiz Afro... 🌍</b>
    </div>

    <div id="erer-conteudo" style="display: none;">
        <div id="erer-background-image"></div>

        <main>
            <div id="erer-start-screen" class="erer-screen">
                <h1>✊🏿 Quiz da Consciência Negra</h1>
                <p>
                    Um jogo sobre história, resistência e cultura afro-brasileira.<br>
                    Inspirado na força de <b>Zumbi dos Palmares</b> e das comunidades quilombolas.
                </p>
                <button id="erer-start-button"><b>5</b> Iniciar Jogo</button>
            </div>

            <div id="erer-game-screen" class="erer-screen erer-hidden">
                <h2 id="erer-question-text"></h2>

                <div id="erer-life-container">
                    <img id="erer-life-1" src="img/sprites/vida-azul.png" class="erer-life-icon">
                    <img id="erer-life-2" src="img/sprites/vida-branca.png" class="erer-life-icon">
                    <img id="erer-life-3" src="img/sprites/vida-rosa.png" class="erer-life-icon">
                </div>

                <div id="erer-score-display">Pontos: <span id="erer-current-score">0</span></div>

                <div id="erer-options-container">
                    <button id="erer-option-a" class="erer-option-button erer-blue-button"><span>4</span></button>
                    <button id="erer-option-b" class="erer-option-button erer-yellow-button"><span>8</span></button>
                    <button id="erer-option-c" class="erer-option-button erer-purple-button"><span>6</span></button>
                    <button id="erer-option-d" class="erer-option-button erer-pink-button"><span>2</span></button>
                </div>
            </div>

            <div id="erer-end-game-screen" class="erer-screen erer-hidden">
                <h2 id="erer-end-game-message"></h2>
                <p>Sua pontuação: <span id="erer-final-score"></span></p>
                <p id="erer-ranking-message"></p>

                <div id="erer-photo-countdown" class="erer-hidden"></div>

                <div id="erer-moldura">
                    <video id="erer-webcam" autoplay playsinline class="erer-hidden"></video>
                </div>

                <canvas id="erer-canvas" class="erer-hidden"></canvas>
                <div id="erer-ranking-container"></div>
                <p id="erer-countdown" class="erer-hidden"></p>

                <button id="erer-restart-button">Jogar Novamente</button>
            </div>

            <div id="erer-credits">Desenvolvido por Junior Criste</div>
            <div id="erer-glitch-overlay" class="erer-hidden"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
